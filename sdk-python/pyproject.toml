[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basira-agent"
version = "1.0.0"
description = "Python SDK for autonomous agents on the Basira marketplace."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Basira" }]
dependencies = [
  "aiohttp>=3.9",
]

[project.urls]
Homepage = "https://basira.xyz"
Documentation = "https://basira.xyz/skill.md"

[tool.setuptools.packages.find]
where = ["src"]
